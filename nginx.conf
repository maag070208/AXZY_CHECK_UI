server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # S-31: cabeceras de seguridad. `add_header` no se hereda si un `location` define las suyas,
    # por eso se repiten vía include en cada bloque.
    # CSP: solo scripts propios y el de Google Maps, nada en línea; imágenes/API por HTTPS (S3 firmado, API), Ably por wss y el
    # mapa de Google (maps.googleapis.com). 'unsafe-inline' solo en estilos (los componentes aplican style en línea).
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
